apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-gateway-alerts
  namespace: ai-gateway
spec:
  groups:
    - name: ai-gateway.rules
      rules:
        - alert: AiGatewayHighErrorRate
          expr: sum(rate(gateway_errors_total[5m])) / sum(rate(gateway_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "AI Gateway error rate above 5%"
        - alert: AiGatewayCircuitBreakerOpen
          expr: max(gateway_circuit_breaker_state) > 0.5
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Circuit breaker OPEN for at least one provider"
        - alert: AiGatewayHighLatency
          expr: histogram_quantile(0.95, sum(rate(gateway_request_duration_seconds_bucket[5m])) by (le, provider)) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "p95 latency above 10s"
