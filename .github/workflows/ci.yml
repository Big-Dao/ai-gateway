name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ─── Job 1: Lint — fast feedback (2-3 min) ───────────────────────────
  lint:
    name: Lint & Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          sharedKey: lint

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo doc --no-deps
        run: cargo doc --workspace --no-deps

  # ─── Job 2: Test — core tests on multiple platforms (3-5 min) ────────
  test:
    name: Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          sharedKey: test-${{ matrix.os }}

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets 2>&1 | tee /tmp/test-output.txt

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: /tmp/test-output.txt
          retention-days: 7

  # ─── Job 3: Security — cargo audit (2-3 min) ─────────────────────────
  security:
    name: Security Audit
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          sharedKey: security

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  # ─── Job 4: Build — release artifacts (5 min) ────────────────────────
  build:
    name: Build Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          sharedKey: build-release

      - name: cargo build --release --workspace
        run: cargo build --release --workspace

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: gateway-server-release
          path: target/release/gateway-server
          retention-days: 14

  # ─── Job 5: Coverage — llvm-cov (5 min, optional) ────────────────────
  coverage:
    name: Code Coverage
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          sharedKey: coverage

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-targets --html 2>&1 | tee /tmp/cov-output.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 14

      # Uncomment if you integrate with Codecov:
      # - name: Upload to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     files: target/llvm-cov/lcov.info
      #     fail_ci_if_error: false
