# AI Gateway Configuration
# Copy this file to config.toml and fill in your API keys.

[server]
host = "0.0.0.0"
port = 8080

# ─── Provider: OpenAI ───────────────────────────────────────────────
[providers.openai]
api_key = "sk-your-openai-key"
base_url = "https://api.openai.com/v1"
models = ["gpt-4o", "gpt-4o-mini", "gpt-3.5-turbo"]

# ─── Provider: Anthropic ────────────────────────────────────────────
[providers.anthropic]
api_key = "sk-ant-your-anthropic-key"
base_url = "https://api.anthropic.com/v1"
models = ["claude-sonnet-4-6", "claude-opus-4-8", "claude-haiku-4-5-20251001"]

# ─── Provider: Google Gemini ────────────────────────────────────────
[providers.gemini]
api_key = "your-gemini-api-key"
base_url = "https://generativelanguage.googleapis.com/v1beta"
models = ["gemini-2.5-flash", "gemini-2.5-pro"]

# ─── Provider: Ollama (local) ───────────────────────────────────────
[providers.ollama]
# No API key needed for local Ollama
base_url = "http://localhost:11434"
models = ["llama3.3", "mistral", "codellama"]

# ─── Rate Limiting ──────────────────────────────────────────────────
[rate_limit]
requests_per_minute = 60

# ─── Response Cache ─────────────────────────────────────────────────
[cache]
enabled = true
max_capacity = 1000
ttl_seconds = 300

# ─── Pricing (per-model metering) ───────────────────────────────────
# When a model has no entry and no default is set, calls are free.
[pricing]
default = { input_per_1m = 5.0, output_per_1m = 15.0 }

[pricing.models."gpt-4o"]
input_per_1m = 2.5
output_per_1m = 10.0

[pricing.models."claude-sonnet-4-6"]
input_per_1m = 3.0
output_per_1m = 15.0

# ─── Authentication ─────────────────────────────────────────────────
[auth]
enabled = true
api_keys = ["my-secret-key", "another-key"]
